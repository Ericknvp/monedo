<style>
        .organic-blob {
            filter: blur(80px);
            opacity: 0.4;
            transition: all 5s ease-in-out;
        }
        input:focus + label,
        input:not(:placeholder-shown) + label {
            transform: translateY(-24px) scale(0.9);
            color: #00734f;
        }
        label {
            transition: all 0.2s ease-out;
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen overflow-hidden font-body-md">
<main class="flex min-h-screen">
<!-- Left Side: Branding & Visuals -->
<section class="hidden lg:flex lg:w-1/2 bg-primary relative overflow-hidden items-center justify-center p-20">
<!-- Animated Organic Blobs -->
<div class="organic-blob absolute -top-20 -left-20 w-[500px] h-[500px] bg-secondary-fixed rounded-full" id="blob-1"></div>
<div class="organic-blob absolute top-1/2 -right-20 w-[400px] h-[400px] bg-on-secondary-container rounded-full" id="blob-2"></div>
<div class="organic-blob absolute -bottom-40 left-1/4 w-[600px] h-[600px] bg-secondary rounded-full" id="blob-3"></div>
<div class="relative z-10 text-center max-w-lg">
<div class="flex items-center justify-center mb-8">
<span class="material-symbols-outlined text-[64px] text-secondary-fixed" data-icon="account_balance_wallet" style="font-variation-settings: 'FILL' 1;">account_balance_wallet</span>
</div>
<h1 class="font-display-lg text-display-lg text-white mb-6">Monedo</h1>
<p class="font-headline-md text-headline-md text-secondary-fixed opacity-90 leading-relaxed">
                    Your money, finally makes sense.
                </p>
<!-- Atmospheric Card -->
<div class="mt-16 bg-white/5 backdrop-blur-xl border border-white/10 p-8 rounded-lg text-left shadow-2xl">
<div class="flex gap-4 items-center mb-4">
<div class="w-12 h-12 rounded-full bg-secondary-fixed/20 flex items-center justify-center">
<span class="material-symbols-outlined text-secondary-fixed" data-icon="insights">insights</span>
</div>
<div>
<p class="text-white font-label-md text-label-md">Personal Insights</p>
<p class="text-on-primary-container text-label-sm font-label-sm">Updated just now</p>
</div>
</div>
<div class="space-y-3">
<div class="h-2 w-full bg-white/10 rounded-full overflow-hidden">
<div class="h-full bg-secondary-fixed w-3/4 rounded-full"></div>
</div>
<p class="text-on-primary-container text-label-sm font-label-sm">You've saved 15% more than last month!</p>
</div>
</div>
</div>
</section>
<!-- Right Side: Interaction Area -->
<section class="w-full lg:w-1/2 bg-white flex items-center justify-center px-6 lg:px-container-margin py-20 relative">
<!-- Mobile Logo Only -->
<div class="lg:hidden absolute top-10 left-10 flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="account_balance_wallet" style="font-variation-settings: 'FILL' 1;">account_balance_wallet</span>
<span class="font-headline-md text-headline-md text-primary font-bold">Monedo</span>
</div>
<div class="w-full max-w-md space-y-12" id="auth-container">
<!-- Header -->
<div class="space-y-2">
<h2 class="font-display-lg text-display-lg-mobile lg:text-[40px] text-primary tracking-tight" id="form-title">Welcome back</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant" id="form-subtitle">Please enter your details to access your dashboard.</p>
</div>
<!-- Form -->
<form class="space-y-10" id="auth-form" onsubmit="return false;">
<!-- Email Field -->
<div class="relative group">
<input class="peer w-full bg-transparent border-0 border-b-2 border-surface-variant py-4 focus:ring-0 focus:border-secondary transition-all font-body-md text-body-md text-primary" id="email" placeholder=" " type="email"/>
<label class="absolute left-0 top-4 text-on-surface-variant font-label-md text-label-md transition-all" for="email">
                            Email Address
                        </label>
</div>
<!-- Password Field -->
<div class="relative group">
<input class="peer w-full bg-transparent border-0 border-b-2 border-surface-variant py-4 focus:ring-0 focus:border-secondary transition-all font-body-md text-body-md text-primary" id="password" placeholder=" " type="password"/>
<label class="absolute left-0 top-4 text-on-surface-variant font-label-md text-label-md transition-all" for="password">
                            Password
                        </label>
<button class="absolute right-0 top-4 text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
<!-- Actions -->
<div class="flex items-center justify-between pt-2">
<label class="flex items-center gap-3 cursor-pointer group">
<div class="relative flex items-center">
<input class="peer h-5 w-5 rounded border-2 border-surface-variant text-secondary focus:ring-secondary/20 transition-all" type="checkbox"/>
</div>
<span class="font-label-md text-label-md text-on-surface-variant group-hover:text-primary transition-colors">Remember me</span>
</label>
<button class="font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors" type="button">
                            Forgot Password?
                        </button>
</div>
<!-- Submit Button -->
<button class="w-full bg-secondary text-white py-5 rounded-full font-headline-md text-headline-md shadow-lg shadow-secondary/20 hover:shadow-xl hover:scale-[1.02] active:scale-95 transition-all duration-300 flex items-center justify-center gap-3" type="submit">
<span>Sign In</span>
<span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
<!-- Social Login -->
<div class="pt-4 text-center">
<p class="font-label-sm text-label-sm text-on-surface-variant mb-6 uppercase tracking-widest">Or continue with</p>
<div class="flex justify-center gap-6">
<button class="w-14 h-14 rounded-full bg-surface-container flex items-center justify-center hover:bg-surface-variant transition-colors active:scale-90" type="button">
<img alt="Google Logo" class="w-6 h-6" data-alt="The official Google 'G' icon with its signature four-color palette of red, yellow, green, and blue, presented in a crisp, high-resolution minimalist style." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBUx1jCH884K1AZLMfL612D2sqOWoNrnGzZxmwjaZRCAM4oJ04JwKvunXcSReQ01_nqB2T1GKgj9J9MO-JxuSsqmdoE__bZt-ppFRshuUttY5K08kwxLHNUqjB2wWS6b96ok4jVTbSW25bej_iKEmsnndeToHMtd4yK-mI69PFQUtqT_jQ-I1ps2JD-kpai_pqcQZE2UUMRbjlmws_dIDuV07v2mIu5ki7w1gQ-MP8vmnxvLUua9yMcnAvhOeC4IepIsTIAscu_saE"/>
</button>
<button class="w-14 h-14 rounded-full bg-surface-container flex items-center justify-center hover:bg-surface-variant transition-colors active:scale-90" type="button">
<span class="material-symbols-outlined text-primary" data-icon="apple">ios</span>
</button>
</div>
</div>
</form>
<!-- Footer Switch -->
<div class="text-center pt-8 border-t border-surface-container">
<p class="font-body-md text-body-md text-on-surface-variant">
                        Don't have an account? 
                        <button class="text-secondary font-bold ml-1 hover:underline decoration-2 underline-offset-4" id="toggle-auth" onclick="toggleMode()">
                            Create Account
                        </button>
</p>
</div>
</div>
</section>
</main>
<script>
        let isLogin = true;

        function toggleMode() {
            const title = document.getElementById('form-title');
            const subtitle = document.getElementById('form-subtitle');
            const btnText = document.querySelector('button[type="submit"] span');
            const toggleBtn = document.getElementById('toggle-auth');
            const authContainer = document.getElementById('auth-container');

            // Animation transition
            authContainer.style.opacity = '0';
            authContainer.style.transform = 'translateY(10px)';

            setTimeout(() => {
                isLogin = !isLogin;
                
                if (isLogin) {
                    title.innerText = 'Welcome back';
                    subtitle.innerText = 'Please enter your details to access your dashboard.';
                    btnText.innerText = 'Sign In';
                    toggleBtn.innerText = 'Create Account';
                } else {
                    title.innerText = 'Join Monedo';
                    subtitle.innerText = 'Start your journey to financial clarity today.';
                    btnText.innerText = 'Get Started';
                    toggleBtn.innerText = 'Sign In';
                }

                authContainer.style.opacity = '1';
                authContainer.style.transform = 'translateY(0)';
            }, 300);
        }

        // Atmospheric Blob Movement
        function animateBlobs() {
            const blobs = [
                document.getElementById('blob-1'),
                document.getElementById('blob-2'),
                document.getElementById('blob-3')
            ];

            blobs.forEach(blob => {
                const move = () => {
                    const x = Math.random() * 100 - 50;
                    const y = Math.random() * 100 - 50;
                    const scale = 0.8 + Math.random() * 0.5;
                    blob.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
                };
                move();
                setInterval(move, 6000);
            });
        }

        animateBlobs();

        // Simple Form Submission feedback
        document.getElementById('auth-form').addEventListener('submit', (e) => {
            const btn = e.target.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span>';
            btn.disabled = true;

            setTimeout(() => {
                btn.innerHTML = originalContent;
                btn.disabled = false;
                alert(isLogin ? 'Authenticating...' : 'Creating your account...');
            }, 1500);
        });
    </script>
</body></html>
